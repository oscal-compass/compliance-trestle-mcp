# Publishes an existing GitHub Release's artifacts to PyPI (or Test PyPI).
#
# This does NOT build — it downloads the sdist + wheel that the `release`
# workflow already attached to the given tag's Release and uploads those exact
# files. That guarantees Test PyPI and production PyPI get identical artifacts.
#
# Typical flow: run this with environment=test first, verify on Test PyPI, then
# run again with the same tag and environment=production.

name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.2.0)"
        required: true
        type: string
      environment:
        description: "Target environment (test or production)"
        required: true
        type: choice
        options:
          - test
          - production
        default: test

jobs:
  publish-to-pypi:
    name: Publish ${{ inputs.tag }} to ${{ inputs.environment == 'test' && 'Test PyPI' || 'PyPI' }}
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment == 'test' && 'test-pypi' || 'pypi' }}
      url: ${{ inputs.environment == 'test' && 'https://test.pypi.org/p/compliance-trestle-mcp' || 'https://pypi.org/p/compliance-trestle-mcp' }}

    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing
      contents: read # required to download the Release assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts from the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ inputs.tag }}" \
            --dir dist \
            --pattern "*.whl" \
            --pattern "*.tar.gz"
          echo "Downloaded artifacts:"
          ls -l dist

      - name: Publish distribution 📦 to ${{ inputs.environment == 'test' && 'Test PyPI' || 'PyPI' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.environment == 'test' && 'https://test.pypi.org/legacy/' || '' }}
