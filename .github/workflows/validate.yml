# Validation gate that runs on every pull request (and on pushes to main).
# Add further checks as separate jobs below.

name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Check versions agree across pyproject.toml and server.json
        run: python scripts/check_versions.py

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/unit

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # These drive the real trestle CLI through an in-process MCP server. No
      # model and no network are involved: every fixture is local, so the job
      # costs runner time only. See tests/e2e/test_new_tools.py.
      - name: Run end-to-end tests
        run: pytest tests/e2e
