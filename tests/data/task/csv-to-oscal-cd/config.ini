# Sample configuration for `trestle task csv-to-oscal-cd`, kept beside the CSV
# it drives. Run it from the repository root, inside a trestle workspace that
# has the control source imported as `nist-sample` — the CSV's Profile_Source
# column is a trestle:// href into the workspace, so the task needs no network.
[task.csv-to-oscal-cd]
title = ACME Component Definition
version = 1.0.0
csv-file = tests/data/task/csv-to-oscal-cd/components.csv
output-dir = /tmp/trestle-test/component-definitions
output-overwrite = true
validate-controls = off
